name: CI/CD Pipeline

# Trigger the workflow on push and pull request events
on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

# Define environment variables for the workflow
env:
  PYTHON_VERSION: '3.12'
  
jobs:
  # Job 1: Build and Test
  build:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning
      
      # Step 2: Set up Python environment
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'  # Cache pip dependencies for faster builds
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pylint
      
      # Step 4: Lint Python code with flake8
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 car.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 car.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true  # Continue even if linting has warnings
      
      # Step 5: Run pylint for additional code quality checks
      - name: Check code quality with pylint
        run: |
          pylint car.py --exit-zero --max-line-length=127 --disable=C0103,C0114,C0115,C0116,R0902,R0912,R0913,R0914,R0915
        continue-on-error: true  # Continue even if there are quality issues
      
      # Step 6: Verify project structure
      - name: Verify project structure
        run: |
          python -c "import car; print(f'Version: {car.__version__}')"
          python -c "import car; print(f'Author: {car.__author__}')"
          python -c "import car; print(f'Description: {car.__description__}')"
      
      # Step 7: Build executable with PyInstaller
      - name: Build executable
        run: |
          cd project
          python -m PyInstaller --clean --log-level=INFO SpeedyHighway.spec
          # Move executable to expected location
          if (Test-Path "dist\SpeedyHighway.exe") {
            Move-Item "dist\SpeedyHighway.exe" "..\SpeedyHighway.exe"
            Write-Host "Build successful!"
          } else {
            Write-Error "Build failed - executable not found"
            exit 1
          }
        shell: pwsh
      
      # Step 8: Verify build artifacts
      - name: Verify build artifacts
        run: |
          if (Test-Path "SpeedyHighway.exe") {
            $fileInfo = Get-Item "SpeedyHighway.exe"
            Write-Host "Executable size: $($fileInfo.Length / 1MB) MB"
            Write-Host "Build completed successfully!"
          } else {
            Write-Error "Executable not found!"
            exit 1
          }
        shell: pwsh
      
      # Step 9: Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpeedyHighway-Windows-${{ github.sha }}
          path: SpeedyHighway.exe
          retention-days: 30
          if-no-files-found: error
      
      # Step 10: Upload data directory as artifact (for verification)
      - name: Upload data directory
        uses: actions/upload-artifact@v4
        with:
          name: game-data-${{ github.sha }}
          path: data/
          retention-days: 7
          if-no-files-found: warn

  # Job 2: Deploy (only runs on main branch after successful build)
  deploy:
    name: Deploy to Release
    runs-on: ubuntu-latest
    needs: build  # Only run after build job succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Download build artifacts
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: SpeedyHighway-Windows-${{ github.sha }}
          path: ./artifacts
      
      # Step 3: Get version from source
      - name: Get version
        id: version
        run: |
          VERSION=$(grep -o '__version__ = "[^"]*"' car.py | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version detected: $VERSION"
      
      # Step 4: Create release tag (only if pushing a new version)
      - name: Create Release
        id: create_release
        if: startsWith(github.event.head_commit.message, 'Release') || startsWith(github.event.head_commit.message, 'Version')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          release_name: Release v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          body: |
            ## SpeedyHighway v${{ steps.version.outputs.version }}
            
            ### Build Information
            - Build Number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            
            ### Download
            Download `SpeedyHighway.exe` from the assets below to play the game.
            
            ### System Requirements
            - Windows 7/8/10/11 (64-bit)
            - 100MB RAM minimum
            - 50MB free disk space
            
            ### Changes
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
        continue-on-error: true  # Don't fail if release already exists
      
      # Step 5: Upload release asset
      - name: Upload Release Asset
        if: steps.create_release.outputs.upload_url
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/SpeedyHighway.exe
          asset_name: SpeedyHighway.exe
          asset_content_type: application/octet-stream
        continue-on-error: true
      
      # Step 6: Deployment notification
      - name: Deployment notification
        run: |
          echo "::notice::Deployment completed successfully for version ${{ steps.version.outputs.version }}"
          echo "Build artifacts are available in the Actions artifacts section"
          echo "Release created (if applicable) with tag v${{ steps.version.outputs.version }}-${{ github.run_number }}"

  # Job 3: Code Quality Report (runs in parallel with build)
  code-quality:
    name: Code Quality Report
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      # Step 3: Install analysis tools
      - name: Install analysis tools
        run: |
          pip install radon bandit safety
      
      # Step 4: Complexity analysis
      - name: Analyze code complexity
        run: |
          echo "### Cyclomatic Complexity Analysis" >> $GITHUB_STEP_SUMMARY
          radon cc car.py -a -s >> $GITHUB_STEP_SUMMARY || true
      
      # Step 5: Maintainability index
      - name: Check maintainability
        run: |
          echo "### Maintainability Index" >> $GITHUB_STEP_SUMMARY
          radon mi car.py -s >> $GITHUB_STEP_SUMMARY || true
      
      # Step 6: Security scan
      - name: Security scan with bandit
        run: |
          bandit -r car.py -f txt -o bandit-report.txt || true
          if [ -f bandit-report.txt ]; then
            echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
            cat bandit-report.txt >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true
